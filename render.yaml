services:
  - type: web
    name: burgernetz-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://burgernetz-frontend.onrender.com
      - key: PYTHON_VERSION
        value: 3.11.0

  - type: web
    name: burgernetz-frontend
    runtime: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npx serve -s build -l $PORT
    envVars:
      - key: REACT_APP_BACKEND_URL
        value: https://burgernetz-backend.onrender.com
